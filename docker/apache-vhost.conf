<VirtualHost *:__PORT__>
	DocumentRoot /var/www/html/www

	<Directory /var/www/html/www>
		# www/.htaccess (HTTPS redirect, front-controller rewrite, dot-file
		# blocking, gzip/cache headers) only takes effect if AllowOverride
		# permits it — the base php:apache image's default vhost does not.
		AllowOverride All
		Require all granted
	</Directory>

	# Railway (and most PaaS reverse proxies) terminate TLS at the edge and
	# forward plain HTTP to this container — but the visitor's original
	# request WAS HTTPS. Both www/.htaccess's own HTTPS-redirect rule and
	# Nette's session/absolute-URL generation rely on $_SERVER['HTTPS']
	# reflecting that correctly. Without this, .htaccess always believes the
	# connection is insecure and redirects — forever, since the redirected
	# request arrives at the container the exact same way. This trusts the
	# standard X-Forwarded-Proto header the proxy sets.
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
