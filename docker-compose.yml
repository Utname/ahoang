version: "3.1"

services:
    mysql:
        image: mariadb:10.3
        volumes:
            - db:/var/lib/mysql:delegated
        environment:
            - MYSQL_ROOT_PASSWORD=toor
            - MYSQL_DATABASE=website
            - MYSQL_USER=website
            - MYSQL_PASSWORD=website
        ports:
            - 3306:3306
        command: mysqld --sql_mode=""

    webserver:
        image: nginx:alpine
        working_dir: /application
        volumes:
            - .:/application:delegated
            - ./dev/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 80:80
        links:
            - php-fpm

    phpmyadmin:
        depends_on:
            - mysql
        image: phpmyadmin/phpmyadmin
        ports:
            - 8080:80
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: toor
            UPLOAD_LIMIT: 512M

    php-fpm:
        build:
            context: .
            dockerfile: dev/docker/php/DockerfilePhp81
        working_dir: /application
        volumes:
            - .:/application:delegated
        links:
            - mysql

volumes:
    db:
